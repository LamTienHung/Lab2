<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HW1 - Enterprise Data Grid</title>
    <link rel="stylesheet" href="./style.css">
    <script type="module" src="./app.js"></script>
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <header class="site-header">
        <h1>Enterprise Data Grid</h1>
        <p>Accessible Data Management System</p>
    </header>

    <main id="main-content">
        <section class="grid-section" aria-labelledby="grid-title">
            <h2 id="grid-title">Employee Directory</h2>

            <label for="search-input">Search employees</label>
            <input
                type="search"
                id="search-input"
                placeholder="Search by name or department"
            >

            <p id="result-count" aria-live="polite"></p>

            <section class="table-wrapper" aria-label="Employee data">
                <table
                    id="employee-grid"
                     role="grid"
                    aria-label="Employee Directory"
                    aria-describedby="grid-instructions"    
                    aria-multiselectable="false"
                >
                    <thead>
                        <tr role="row">
                            <th scope="col" role="columnheader">
                                <button type="button" data-sort="id">ID</button>
                            </th>
                            <th scope="col" role="columnheader">
                                <button type="button" data-sort="name">Name</button>
                            </th>
                            <th scope="col" role="columnheader">
                                <button type="button" data-sort="department">Department</button>
                            </th>
                            <th scope="col" role="columnheader">
                                <button type="button" data-sort="role">Role</button>
                            </th>
                        </tr>
                    </thead>
                    <tbody id="grid-body"></tbody>
                </table>
            </section>

            <nav class="pagination" aria-label="Table pagination">
                <button type="button" id="prev-page">Previous</button>
                <span id="page-info" aria-live="polite">Page 1</span>
                <button type="button" id="next-page">Next</button>
            </nav>

            <p id="grid-instructions">
                Use arrow keys to navigate cells. Press Enter to select a row
                and Space to toggle selection.
            </p>
        </section>
    </main>

    <footer class="site-footer">
        <p>Lab 02 - Homework 1</p>
    </footer>
</body>
</html>
